name: Apply dashboard analysis flow patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply dashboard analysis flow patch
        run: python3 .github/scripts/patch_dashboard_analysis_flow.py

      - name: Validate patch
        run: |
          grep -q "const isPartialPrediction" src/pages/Dashboard.tsx
          grep -q "isPartialPrediction || !isRecentEnough" src/pages/Dashboard.tsx
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "jstogner-creator"
          git config user.email "jstogner@risenetworkcabling.com"
          git add src/pages/Dashboard.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Prevent injury-only partial analysis from blocking predictions"
            git push
          fi
