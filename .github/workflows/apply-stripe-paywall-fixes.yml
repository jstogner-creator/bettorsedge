name: Apply Stripe and paywall fixes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-stripe-paywall-fixes.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch Stripe webhook parsing and sport-specific paywall access
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(file, before, after, label) {
            const original = fs.readFileSync(file, 'utf8');
            if (!original.includes(before)) {
              if (original.includes(after)) {
                console.log(`${label}: already applied`);
                return;
              }
              throw new Error(`${label}: expected block not found in ${file}`);
            }
            const updated = original.replace(before, after);
            fs.writeFileSync(file, updated);
            console.log(`${label}: patched`);
          }

          replaceOnce(
            'server.ts',
            `  // 1. Standard Middlewares (MUST be before proxy to handle POST bodies)\n  app.use(express.json({ limit: '50mb' }));\n  app.use(express.urlencoded({ limit: '50mb', extended: true }));`,
            `  // 1. Standard Middlewares. Stripe webhooks must keep the raw body for signature verification.\n  const jsonParser = express.json({ limit: '50mb' });\n  const urlencodedParser = express.urlencoded({ limit: '50mb', extended: true });\n\n  app.use((req, res, next) => {\n    if (req.originalUrl === \"/api/webhook\") return next();\n    return jsonParser(req, res, next);\n  });\n\n  app.use((req, res, next) => {\n    if (req.originalUrl === \"/api/webhook\") return next();\n    return urlencodedParser(req, res, next);\n  });`,
            'Stripe raw webhook body handling'
          );

          replaceOnce(
            'src/pages/Dashboard.tsx',
            `    // 4. Their subscription status is active\n    // 5. The sport is explicitly in their subscribedSports list`,
            `    // 4. Their subscription status is active AND the sport is explicitly in their subscribedSports list`,
            'Paywall subscription comment'
          );

          replaceOnce(
            'src/pages/Dashboard.tsx',
            `      userProfile?.subscriptionStatus === 'active' ||\n      (userProfile?.subscribedSports?.includes(sport));`,
            `      (userProfile?.subscriptionStatus === 'active' && userProfile?.subscribedSports?.includes(sport));`,
            'Sport-specific paywall access'
          );
          NODE

      - name: Validate TypeScript syntax affected files exist
        run: |
          test -f server.ts
          test -f src/pages/Dashboard.tsx
          git diff --check

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/pages/Dashboard.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix Stripe webhook parsing and sport paywall access"
            git push
          fi
