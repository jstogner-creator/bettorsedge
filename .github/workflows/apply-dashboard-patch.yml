name: Apply dashboard patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python3 .github/scripts/patch_dashboard_analysis_flow.py

      - name: Commit if changed
        run: |
          git config user.name "jstogner-creator"
          git config user.email "jstogner@risenetworkcabling.com"
          git add src/pages/Dashboard.tsx
          git diff --cached --quiet || git commit -m "Prevent injury-only partial analysis from blocking predictions"
          git push
