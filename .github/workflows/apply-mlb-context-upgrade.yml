name: Apply MLB context upgrade

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-mlb-context-upgrade.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch MLB API context aggregation and analysis enrichment
        run: |
          node <<'NODE'
          const fs = require('fs');

          function write(file, content) {
            fs.writeFileSync(file, content);
            console.log(`updated ${file}`);
          }

          function insertBefore(file, marker, insertion, label) {
            const original = fs.readFileSync(file, 'utf8');
            if (original.includes(insertion.trim().slice(0, 80))) {
              console.log(`${label}: already applied`);
              return;
            }
            if (!original.includes(marker)) throw new Error(`${label}: marker not found in ${file}`);
            write(file, original.replace(marker, `${insertion}\n\n${marker}`));
            console.log(`${label}: patched`);
          }

          function replaceOnce(file, before, after, label) {
            const original = fs.readFileSync(file, 'utf8');
            if (!original.includes(before)) {
              if (original.includes(after)) {
                console.log(`${label}: already applied`);
                return;
              }
              throw new Error(`${label}: expected block not found in ${file}`);
            }
            write(file, original.replace(before, after));
            console.log(`${label}: patched`);
          }

          const mlbContextRoute = `  app.get("/api/mlb/game-context", authenticate, async (req, res) => {
    try {
      const gameId = String(req.query.gameId || "");
      const season = String(req.query.season || new Date().getFullYear());
      const homeTeamId = String(req.query.homeTeamId || "");
      const awayTeamId = String(req.query.awayTeamId || "");

      if (!gameId || !homeTeamId || !awayTeamId) {
        return res.status(400).json({ error: "Missing required query params: gameId, homeTeamId, awayTeamId" });
      }

      const fetchMlb = async (endpoint: string, params: Record<string, string>, ttlMs: number) => {
        const queryParams = new URLSearchParams(params).toString();
        const url = `${apiSportsMlbBaseUrl}/${endpoint}${queryParams ? `?${queryParams}` : ""}`;
        const cacheKey = `api-sports-MLB-context-${url}`;
        const cachedData = apiCache.get(cacheKey);
        if (cachedData) return cachedData;

        console.log(`[API-Sports MLB Context] Fetching: ${url}`);
        const response = await axios.get(url, {
          headers: { "x-apisports-key": apiSportsKey },
          timeout: 30000,
          httpAgent,
          httpsAgent,
        });
        apiCache.set(cacheKey, response.data, ttlMs);
        return response.data;
      };

      const call = async (label: string, endpoint: string, params: Record<string, string>, ttlMs: number) => {
        try {
          const data = await fetchMlb(endpoint, params, ttlMs);
          return { label, ok: true, data };
        } catch (error: any) {
          console.warn(`[API-Sports MLB Context] ${label} failed:`, error.response?.data || error.message);
          return { label, ok: false, error: error.response?.data || error.message };
        }
      };

      const [game, odds, homeStats, awayStats, homeInjuries, awayInjuries, h2h] = await Promise.all([
        call("game", "games", { id: gameId }, 10 * 60 * 1000),
        call("odds", "odds", { game: gameId }, 5 * 60 * 1000),
        call("homeStats", "statistics/teams", { team: homeTeamId, season }, 12 * 60 * 60 * 1000),
        call("awayStats", "statistics/teams", { team: awayTeamId, season }, 12 * 60 * 60 * 1000),
        call("homeInjuries", "injuries", { team: homeTeamId, season }, 60 * 60 * 1000),
        call("awayInjuries", "injuries", { team: awayTeamId, season }, 60 * 60 * 1000),
        call("h2h", "games/h2h", { h2h: `${homeTeamId}-${awayTeamId}` }, 24 * 60 * 60 * 1000),
      ]);

      const present = {
        game: game.ok && Array.isArray(game.data?.response) && game.data.response.length > 0,
        odds: odds.ok && Array.isArray(odds.data?.response) && odds.data.response.length > 0,
        homeStats: homeStats.ok && !!homeStats.data?.response,
        awayStats: awayStats.ok && !!awayStats.data?.response,
        homeInjuries: homeInjuries.ok && Array.isArray(homeInjuries.data?.response),
        awayInjuries: awayInjuries.ok && Array.isArray(awayInjuries.data?.response),
        h2h: h2h.ok && Array.isArray(h2h.data?.response),
      };

      const score = Object.values(present).filter(Boolean).length;
      const grade = score >= 6 ? "A" : score >= 4 ? "B" : score >= 2 ? "C" : "D";

      res.json({
        gameId,
        season,
        homeTeamId,
        awayTeamId,
        fetchedAt: new Date().toISOString(),
        dataQuality: {
          grade,
          score,
          maxScore: Object.keys(present).length,
          present,
          notes: [
            present.game ? "game detail available" : "game detail missing",
            present.odds ? "market odds available" : "market odds missing",
            present.homeStats && present.awayStats ? "both team stat profiles available" : "one or both team stat profiles missing",
            present.homeInjuries && present.awayInjuries ? "injury feeds checked" : "injury feed missing",
            present.h2h ? "head-to-head context available" : "head-to-head context missing",
          ],
        },
        game: game.ok ? game.data?.response || [] : [],
        odds: odds.ok ? odds.data?.response || [] : [],
        teams: {
          home: {
            id: homeTeamId,
            statistics: homeStats.ok ? homeStats.data?.response || null : null,
            injuries: homeInjuries.ok ? homeInjuries.data?.response || [] : [],
          },
          away: {
            id: awayTeamId,
            statistics: awayStats.ok ? awayStats.data?.response || null : null,
            injuries: awayInjuries.ok ? awayInjuries.data?.response || [] : [],
          },
        },
        h2h: h2h.ok ? h2h.data?.response || [] : [],
        sourceStatus: { game, odds, homeStats, awayStats, homeInjuries, awayInjuries, h2h },
      });
    } catch (error: any) {
      console.error("[API-Sports MLB Context] Error:", error.response?.data || error.message);
      res.status(error.response?.status || 500).json(error.response?.data || { error: error.message });
    }
  });`;

          insertBefore(
            'server.ts',
            '  app.get("/api/mlb/:endpoint*", authenticate, async (req, res) => {',
            mlbContextRoute,
            'MLB game-context backend route'
          );

          const apiSportsMlbPath = 'src/services/apiSportsMlb.ts';
          let apiSportsMlb = fs.readFileSync(apiSportsMlbPath, 'utf8');
          if (!apiSportsMlb.includes('export type MlbGameContext')) {
            apiSportsMlb = apiSportsMlb.replace(
              `export type ApiError = {\n  message: string;\n  status?: number;\n  details?: unknown;\n};`,
              `export type ApiError = {\n  message: string;\n  status?: number;\n  details?: unknown;\n};\n\nexport type MlbGameContext = {\n  gameId: string;\n  season: string;\n  homeTeamId: string;\n  awayTeamId: string;\n  fetchedAt: string;\n  dataQuality: {\n    grade: \"A\" | \"B\" | \"C\" | \"D\";\n    score: number;\n    maxScore: number;\n    present: Record<string, boolean>;\n    notes: string[];\n  };\n  game: any[];\n  odds: any[];\n  teams: {\n    home: { id: string; statistics: any; injuries: any[] };\n    away: { id: string; statistics: any; injuries: any[] };\n  };\n  h2h: any[];\n  sourceStatus: Record<string, any>;\n};`
            );
          }

          if (!apiSportsMlb.includes('async getGameContext(filters')) {
            apiSportsMlb = apiSportsMlb.replace(
              `  async getStandings(season: string): Promise<any[]> {`,
              `  async getGameContext(filters: {\n    gameId: number | string;\n    season: number | string;\n    homeTeamId: number | string;\n    awayTeamId: number | string;\n  }): Promise<MlbGameContext | null> {\n    try {\n      const headers = await this.getHeaders();\n      const response = await axios.get(`${this.baseUrl}/game-context`, {\n        params: filters,\n        headers,\n      });\n\n      return response.data || null;\n    } catch (error) {\n      console.error(\"[API-Sports MLB] Error fetching game context:\", error);\n      return null;\n    }\n  }\n\n  async getStandings(season: string): Promise<any[]> {`
            );
          }
          write(apiSportsMlbPath, apiSportsMlb);

          replaceOnce(
            'src/services/gemini.ts',
            `  private calculateEdgeModel(game: Game): EdgeModelResult {`,
            `  private async enrichMlbGame(game: Game, date: string): Promise<Game> {\n    if (game.league !== \"MLB\" || !game.apiSportsGameId || !game.apiSportsHomeTeamId || !game.apiSportsAwayTeamId) {\n      return game;\n    }\n\n    const season = new Date(date || game.date || new Date().toISOString()).getFullYear();\n    const context = await apiSportsMlbService.getGameContext({\n      gameId: game.apiSportsGameId,\n      season,\n      homeTeamId: game.apiSportsHomeTeamId,\n      awayTeamId: game.apiSportsAwayTeamId,\n    });\n\n    if (!context) return game;\n\n    return {\n      ...game,\n      mlbContext: context,\n    } as Game & { mlbContext: any };\n  }\n\n  private calculateEdgeModel(game: Game): EdgeModelResult {`,
            'Add MLB game enrichment helper'
          );

          replaceOnce(
            'src/services/gemini.ts',
            `    let homeProbability = 0.5;\n    const dataQualityReasons: string[] = [];`,
            `    let homeProbability = 0.5;\n    const dataQualityReasons: string[] = [];\n    const mlbContext = (game as any).mlbContext;`,
            'Expose MLB context to edge model'
          );

          replaceOnce(
            'src/services/gemini.ts',
            `    if (game.marketExpectations?.homeWinProb !== undefined && game.marketExpectations?.awayWinProb !== undefined) {`,
            `    if (game.league === \"MLB\" && mlbContext?.dataQuality) {\n      dataQualityReasons.push(...(mlbContext.dataQuality.notes || []).slice(0, 5));\n      if (mlbContext.dataQuality.grade === \"A\") homeProbability += 0.005;\n      if (mlbContext.dataQuality.grade === \"D\") homeProbability = homeProbability * 0.85 + 0.5 * 0.15;\n    }\n\n    if (game.marketExpectations?.homeWinProb !== undefined && game.marketExpectations?.awayWinProb !== undefined) {`,
            'Apply MLB context to model quality'
          );

          replaceOnce(
            'src/services/gemini.ts',
            `      !!game.allSources?.length,\n    ].filter(Boolean).length;`,
            `      !!game.allSources?.length,\n      game.league === \"MLB\" && mlbContext?.dataQuality?.grade && mlbContext.dataQuality.grade !== \"D\",\n    ].filter(Boolean).length;`,
            'Count MLB context in data quality'
          );

          replaceOnce(
            'src/services/gemini.ts',
            `    const edgeModel = this.calculateEdgeModel(game);\n    const predictedHome = edgeModel.modelProbability >= 0.5;\n    const predictedWinner = predictedHome ? game.homeTeam : game.awayTeam;`,
            `    const analysisGame = await this.enrichMlbGame(game, date);\n    const edgeModel = this.calculateEdgeModel(analysisGame);\n    const predictedHome = edgeModel.modelProbability >= 0.5;\n    const predictedWinner = predictedHome ? analysisGame.homeTeam : analysisGame.awayTeam;`,
            'Use enriched MLB game before edge model'
          );

          replaceOnce(
            'src/services/gemini.ts',
            `${JSON.stringify(game, null, 2)}`,
            `${JSON.stringify(analysisGame, null, 2)}`,
            'Send enriched game to OpenAI prompt'
          );

          const replacements = [
            ['game.id', 'analysisGame.id'],
            ['game.league', 'analysisGame.league'],
            ['game.homeTeam', 'analysisGame.homeTeam'],
            ['game.awayTeam', 'analysisGame.awayTeam'],
            ['game.kalshiExpectations', 'analysisGame.kalshiExpectations'],
            ['game.kalshiOdds', 'analysisGame.kalshiOdds'],
            ['game.marketExpectations', 'analysisGame.marketExpectations'],
            ['game.apiSportsGameId', 'analysisGame.apiSportsGameId'],
          ];
          let gemini = fs.readFileSync('src/services/gemini.ts', 'utf8');
          const fnStart = gemini.indexOf('  async analyzeMatchup(');
          const fnEnd = gemini.indexOf('  async batchAnalyzeMatchups(', fnStart);
          let before = gemini.slice(0, fnStart);
          let fn = gemini.slice(fnStart, fnEnd);
          let after = gemini.slice(fnEnd);
          for (const [from, to] of replacements) fn = fn.replaceAll(from, to);
          fn = fn.replaceAll('Game:\n${JSON.stringify(analysisGame, null, 2)}', 'Game with MLB context when available:\n${JSON.stringify(analysisGame, null, 2)}');
          write('src/services/gemini.ts', before + fn + after);
          NODE

      - name: Validate patch
        run: |
          test -f server.ts
          test -f src/services/apiSportsMlb.ts
          test -f src/services/gemini.ts
          grep -q "/api/mlb/game-context" server.ts
          grep -q "getGameContext" src/services/apiSportsMlb.ts
          grep -q "enrichMlbGame" src/services/gemini.ts
          git diff --check

      - name: Commit MLB context upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/services/apiSportsMlb.ts src/services/gemini.ts
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Improve MLB API context aggregation"
            git push
          fi
