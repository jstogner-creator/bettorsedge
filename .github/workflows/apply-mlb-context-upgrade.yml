name: Apply MLB context upgrade

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-mlb-context-upgrade.yml"
      - ".github/scripts/apply_mlb_context_upgrade.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply MLB context upgrade
        run: python3 .github/scripts/apply_mlb_context_upgrade.py

      - name: Validate patch
        run: |
          test -f server.ts
          test -f src/services/apiSportsMlb.ts
          test -f src/services/gemini.ts
          grep -q "/api/mlb/game-context" server.ts
          grep -q "pitching" server.ts
          grep -q "getGameContext" src/services/apiSportsMlb.ts
          grep -q "enrichMlbGame" src/services/gemini.ts
          git diff --check

      - name: Commit MLB context upgrade
        run: |
          git config user.name "jstogner-creator"
          git config user.email "jstogner@risenetworkcabling.com"
          git add server.ts src/services/apiSportsMlb.ts src/services/gemini.ts
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Improve MLB API context aggregation with pitcher focus"
            git push
          fi
