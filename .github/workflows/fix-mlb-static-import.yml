name: Fix MLB static import

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/fix_mlb_static_import.py"
      - ".github/workflows/fix-mlb-static-import.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply MLB static import fix
        run: python3 .github/scripts/fix_mlb_static_import.py

      - name: Commit app fix
        run: |
          git config user.name "jstogner-creator"
          git config user.email "jstogner@risenetworkcabling.com"
          git add src/pages/Dashboard.tsx
          if git diff --cached --quiet; then
            echo "No app changes to commit."
          else
            git commit -m "Fix MLB static schedule import normalization"
            git push
          fi
